[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baymax"
version = "0.7.0"
description = "Bay-Max: A memory-first empathetic companion agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Krishnaa Vinod" },
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.19.0",
    "gradio>=4.0.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
vision = [
    "torch>=2.0.0",
    "facenet-pytorch>=2.5.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
]
vector = [
    "lancedb>=0.5.0",
    "sentence-transformers>=2.2.0",
]
dialogue = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "accelerate>=0.26.0",
]
tts = [
    "kokoro>=0.9.0",
    "soundfile>=0.12.0",
    "sounddevice>=0.4.0",
]
speech = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.0",
    "soundfile>=0.12.0",
]
all = [
    "baymax[dev,vision,vector,dialogue,tts,speech]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/baymax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
